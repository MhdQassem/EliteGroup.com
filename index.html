<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Elite Group | أنظمة الأمن والسلامة</title>
<meta name="description" content="كاميرات مراقبة، إنذار حريق وسرقة، إطفاء آلي FM200، شبكات حاسوبية وWiFi.">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--b:#2f66b3;--d:#3a3a3a;--bg:#f4f6fb}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:76px}
body{font:16px/1.8 Cairo,Tahoma,sans-serif;color:var(--d)}a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:5;background:#fff;box-shadow:0 1px 8px #0002;display:flex;align-items:center;justify-content:space-between;padding:4px 5%}
header img{height:58px}nav a{margin-inline-start:20px;font-weight:700}nav a:hover{color:var(--b)}
.hero{background:linear-gradient(135deg,#1d3f73,var(--b));color:#fff;text-align:center;padding:90px 5%}
.hero h1{font-size:clamp(26px,5vw,46px);font-weight:900}.hero p{max-width:720px;margin:14px auto 28px;opacity:.92}
.btn{display:inline-block;background:#fff;color:var(--b);padding:10px 30px;border-radius:30px;font-weight:700}
section{padding:60px 5%;max-width:1200px;margin:auto}h2{font-size:28px;text-align:center;margin-bottom:28px;color:var(--b)}
#about p{max-width:820px;margin:auto;text-align:center;white-space:pre-line}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.card{background:var(--bg);border-radius:14px;padding:22px;border-top:4px solid var(--b)}.card h3{margin-bottom:4px}
#chips{text-align:center;margin-bottom:20px}#chips button{font:inherit;margin:3px;padding:4px 18px;border:1px solid var(--b);background:#fff;color:var(--b);border-radius:20px;cursor:pointer}
#chips .on{background:var(--b);color:#fff}
figure img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;cursor:zoom-in}
figcaption{display:grid;padding:6px 2px}figcaption small{opacity:.7}
.pt{text-align:center;background:var(--bg);border-radius:14px;padding:16px}.pt img{max-width:100%;height:70px;object-fit:contain;display:block;margin:0 auto 6px}
.pt small{display:block;opacity:.6}
footer{background:#1c2a44;color:#fff;padding:40px 5%;text-align:center}footer ul{list-style:none;padding:0}footer li{margin:4px 0}
footer a[href^="tel"],footer a[href^="mailto"]{direction:ltr;unicode-bidi:embed}footer a:hover{text-decoration:underline}
.lb{position:fixed;inset:0;background:#000d;z-index:9;display:grid;place-items:center;color:#fff;text-align:center;padding:20px;cursor:zoom-out}
.lb img{max-width:94vw;max-height:78vh;border-radius:8px}
</style></head><body>
<header><img src="assets/logo.jpg" alt="Elite Group"><nav><a href="#about">من نحن</a><a href="#services">مجالات العمل</a><a href="#works">أعمالنا</a><a href="#partners">الشركاء</a><a href="#contact">تواصل</a></nav></header>
<div class="hero"><h1 data-k="hero_title"></h1><p data-k="hero_text"></p><a class="btn" href="#contact">تواصل معنا</a></div>
<section id="about"><h2>من نحن</h2><p data-k="about_text"></p></section>
<section id="services"><h2>مجالات العمل</h2><div class="grid"></div></section>
<section id="works"><h2>أعمالنا ومشاريعنا</h2><div id="chips"></div><div class="grid"></div></section>
<section id="partners"><h2>شركاء العمل والبراندات</h2><div class="grid"></div></section>
<footer id="contact"><h2 style="color:#fff">معلومات التواصل</h2><ul id="ct"></ul><p style="margin-top:20px;opacity:.6;font-size:14px">© Elite Group — Security &amp; Safety System</p></footer>
<script>
const $=s=>document.querySelector(s),el=(t,p={},...k)=>{const e=Object.assign(document.createElement(t),p);e.append(...k);return e};
fetch('api/index.php?a=public').then(r=>r.json()).then(d=>{
 const c=d.content||{};
 document.querySelectorAll('[data-k]').forEach(e=>e.textContent=c[e.dataset.k]||'');
 const fill=(id,items,fn)=>{if(items.length)$('#'+id+' .grid').append(...items.map(fn));else{$('#'+id).remove();document.querySelector(`nav a[href="#${id}"]`).remove()}};
 fill('services',d.services,s=>el('div',{className:'card'},el('h3',{textContent:s.title}),el('p',{textContent:s.description||''})));
 const box=w=>{const o=el('div',{className:'lb',onclick:()=>o.remove()},el('img',{src:'uploads/'+w.image}),el('p',{textContent:w.title+(w.description?' — '+w.description:'')}));document.body.append(o)};
 const card=w=>el('figure',{},el('img',{src:'uploads/'+w.image,alt:w.title,loading:'lazy',onclick:()=>box(w)}),el('figcaption',{},el('b',{textContent:w.title}),el('small',{textContent:w.description||''})));
 fill('works',d.works,card);
 const g=$('#works .grid'),cats=d.categories.filter(k=>d.works.some(w=>w.category_id==k.id));
 if(cats.length)$('#chips').append(...[{id:0,name:'الكل'},...cats].map(k=>el('button',{textContent:k.name,className:k.id?'':'on',onclick:e=>{g.replaceChildren(...d.works.filter(w=>!k.id||w.category_id==k.id).map(card));document.querySelectorAll('#chips button').forEach(b=>b.classList.toggle('on',b===e.target))}})));
 fill('partners',d.partners,p=>el('div',{className:'pt'},p.logo?el('img',{src:'uploads/'+p.logo,alt:p.name}):'',el('b',{textContent:p.name}),el('small',{textContent:p.kind==='brand'?'براند':'شريك عمل'})));
 const tel=v=>'tel:'+v.replace(/[^\d+]/g,''),url=v=>/^https?:\/\//.test(v)?v:null;
 const L=[['📞 هاتف',c.phone1,tel],['📞 هاتف',c.phone2,tel],['💬 واتساب',c.whatsapp,v=>'https://wa.me/'+v.replace(/\D/g,'')],['✉️ البريد',c.email,v=>'mailto:'+v],['📍 العنوان',c.address],['🕘 الدوام',c.hours],['فيسبوك',c.facebook,url],['إنستغرام',c.instagram,url]];
 $('#ct').append(...L.filter(x=>x[1]).map(([l,v,h])=>{const href=h&&h(v);return el('li',{},l+': ',href?el('a',{href,textContent:v,target:'_blank',rel:'noopener'}):v)}));
});
</script></body></html>
